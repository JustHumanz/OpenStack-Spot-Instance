metrics:
  driver: metrics-server
  prometheus_url: ""
  prometheus_query: '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))'
  kubeconfig: ""
  host_map: {}

spot:
  flavors:
    - replace-with-spot-flavor-uuid
  threshold: 80
  min_improvement: 20
  shelve_when_no_destination: true

controller:
  interval: 1m
  cooldown: 30m
  max_metrics_age: 3m
  dry_run: true